<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jigsaw Puzzle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#f6d365,#fda085);font-family:'Segoe UI',system-ui,sans-serif}
.app{width:100%;max-width:420px;height:746px;max-height:100vh;background:#fffbf5;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
header{padding:16px;background:linear-gradient(135deg,#f97316,#ec4899);color:#fff;text-align:center}
header h1{font-size:22px;margin-bottom:10px}
.stats{display:flex;justify-content:space-around;font-size:14px;font-weight:600}
.stats span{background:rgba(255,255,255,.2);padding:6px 14px;border-radius:20px}
.preview-bar{margin:10px 20px;padding:10px;background:#fef3c7;border-radius:12px;text-align:center;font-size:14px;font-weight:600;color:#92400e;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px;padding:0 20px;aspect-ratio:1;background:#e5e7eb;border-radius:12px;margin:0 20px}
.cell{background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:44px;cursor:pointer;transition:all .15s;user-select:none;min-height:70px}
.cell.filled{background:linear-gradient(135deg,#fef3c7,#fde68a);cursor:default}
.cell.selected{box-shadow:inset 0 0 0 3px #ec4899}
.cell.placeholder{background:#f3f4f6;color:#9ca3af;font-size:20px}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:16px 20px;flex:1;align-content:flex-start}
.tile{width:60px;height:60px;background:linear-gradient(135deg,#f97316,#ec4899);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;box-shadow:0 4px 0 #be185d;transition:all .1s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #be185d}
.tile.selected{box-shadow:0 0 0 4px #fbbf24,0 4px 0 #be185d}
.tile:empty{display:none}
.controls{display:flex;gap:10px;padding:0 20px 24px}
.btn{flex:1;padding:14px;border:none;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;color:#fff}
.btn.shuffle{background:linear-gradient(135deg,#3b82f6,#8b5cf6)}
.btn.new{background:linear-gradient(135deg,#22c55e,#16a34a)}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.75);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;z-index:20}
.overlay.show{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.overlay h2{font-size:36px;margin-bottom:16px}
.overlay p{font-size:18px;margin-bottom:24px}
.overlay button{padding:14px 32px;border:none;border-radius:14px;background:#4ade80;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header><h1>🧩 Jigsaw Puzzle</h1>
    <div class="stats"><span>Moves: <b id="moves">0</b></span><span>Time: <b id="timer">0s</b></span></div>
  </header>
  <div class="preview-bar" id="previewBar">👁 Show Preview</div>
  <div class="grid" id="grid"></div>
  <div class="tray" id="tray"></div>
  <div class="controls">
    <button class="btn shuffle" id="shuffle">🔀 Shuffle</button>
    <button class="btn new" id="newGame">🔄 New Puzzle</button>
  </div>
  <div class="overlay" id="overlay">
    <h2>🎉 Solved!</h2>
    <p id="finalStats"></p>
    <button id="again">New Puzzle</button>
  </div>
</div>
<script>
const SCENES=[
  {name:'Farm',bg:'#fef3c7',emojis:['🐮','🐔','🐷','🌾','🚜','🐴','🌽','🐑','🥚']},
  {name:'Ocean',bg:'#dbeafe',emojis:['🐟','🐙','🦀','🐠','🐬','🦈','🐚','🌊','🐳']},
  {name:'Space',bg:'#1e1b4b',emojis:['🚀','🌙','⭐','🪐','👽','🛸','☄️','🌍','👨‍🚀']},
  {name:'Forest',bg:'#dcfce7',emojis:['🌳','🦊','🍄','🐿️','🦉','🌲','🐻','🦌','🌿']}
];
const gridEl=document.getElementById('grid'),trayEl=document.getElementById('tray'),movesEl=document.getElementById('moves'),timerEl=document.getElementById('timer'),overlay=document.getElementById('overlay'),finalStats=document.getElementById('finalStats'),previewBar=document.getElementById('previewBar');
let currentScene,pieces,selectedTile=null,moves=0,time=0,interval=null,started=false,previewMode=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newPuzzle(){
  currentScene=SCENES[Math.floor(Math.random()*SCENES.length)];
  pieces=shuffle([...currentScene.emojis]);
  selectedTile=null;moves=0;time=0;started=false;previewMode=false;
  movesEl.textContent=0;timerEl.textContent='0s';overlay.classList.remove('show');
  clearInterval(interval);previewBar.textContent='👁 Show Preview';
  render();
}
function render(){
  gridEl.innerHTML='';trayEl.innerHTML='';
  for(let i=0;i<9;i++){
    const d=document.createElement('div');d.className='cell';d.dataset.i=i;
    d.onclick=()=>placeInGrid(i);
    gridEl.appendChild(d);
  }
  pieces.forEach((e,i)=>{
    const t=document.createElement('div');t.className='tile';t.textContent=e;t.dataset.e=e;
    t.onclick=()=>selectTile(t);
    trayEl.appendChild(t);
  });
  updateGrid();
}
function selectTile(t){
  document.querySelectorAll('.tile').forEach(x=>x.classList.remove('selected'));
  if(selectedTile===t){selectedTile=null;return}
  selectedTile=t;t.classList.add('selected');
}
function placeInGrid(i){
  if(!selectedTile)return;
  const cell=gridEl.children[i];
  if(cell.classList.contains('filled'))return;
  startTimer();
  cell.textContent=selectedTile.textContent;
  cell.classList.add('filled');
  selectedTile.remove();selectedTile=null;moves++;movesEl.textContent=moves;
  if(!started){started=true;interval=setInterval(()=>{time++;timerEl.textContent=time+'s'},1000)}
  updateGrid();
  if(document.querySelectorAll('.cell.filled').length===9){
    clearInterval(interval);
    setTimeout(()=>{finalStats.textContent=`Moves: ${moves} | Time: ${time}s`;overlay.classList.add('show')},400);
  }
}
function updateGrid(){
  // if preview mode, temporarily show full image
  if(previewMode){
    const all=[...currentScene.emojis];
    gridEl.querySelectorAll('.cell').forEach((c,i)=>{c.textContent=all[i];c.classList.add('placeholder')});
  }else{
    gridEl.querySelectorAll('.cell').forEach(c=>c.classList.remove('placeholder'));
  }
}
function startTimer(){
  if(!started){started=true;interval=setInterval(()=>{time++;timerEl.textContent=time+'s'},1000)}
}
previewBar.onclick=()=>{
  previewMode=!previewMode;
  previewBar.textContent=previewMode?'✖ Hide Preview':'👁 Show Preview';
  if(previewMode){
    const filled=gridEl.querySelectorAll('.cell.filled');
    filled.forEach(c=>{c.dataset.oldText=c.textContent;c.textContent=currentScene.emojis[+c.dataset.i];c.classList.add('placeholder')});
  }else{
    gridEl.querySelectorAll('.cell').forEach(c=>{if(c.dataset.oldText){c.textContent=c.dataset.oldText;delete c.dataset.oldText;c.classList.remove('placeholder')}});
  }
};
document.getElementById('shuffle').onclick=()=>{
  // return all placed pieces to tray
  gridEl.querySelectorAll('.cell.filled').forEach(c=>{
    const e=c.textContent;c.textContent='';c.classList.remove('filled');
    const t=document.createElement('div');t.className='tile';t.textContent=e;t.onclick=()=>selectTile(t);trayEl.appendChild(t);
  });
  selectedTile=null;
};
document.getElementById('newGame').onclick=newPuzzle;
document.getElementById('again').onclick=newPuzzle;
newPuzzle();
</script>
</body>
</html>
