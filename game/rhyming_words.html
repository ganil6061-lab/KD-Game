<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Rhyming Words Pro — 500+ Words</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    overflow: hidden;

    color: #f1f5f9;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: 12px 14px;
    gap: 10px;
    max-width: 520px;
    margin: 0 auto;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .header h1 {
    margin: 0;
    font-size: 17px;
    letter-spacing: 0.3px;
    background: linear-gradient(90deg, #a78bfa, #f472b6, #fbbf24);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
    white-space: nowrap;
  }
  .stats { display: flex; gap: 6px; align-items: center; }
  .badge {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 5px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    transition: transform 0.2s;
  }
  .badge.score { color: #fbbf24; }
  .badge.streak { color: #f472b6; }
  .badge.streak.fire { background: rgba(239,68,68,0.2); border-color: #ef4444; }
  .badge.bump { animation: bump 0.3s; }
  @keyframes bump { 50% { transform: scale(1.25); } }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: #94a3b8;
    font-weight: 600;
    margin: 0 2px;
  }
  .progress-bar {
    height: 6px;
    background: #1e293b;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 4px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #8b5cf6, #ec4899, #fbbf24);
    transition: width 0.4s ease;
    border-radius: 4px;
  }
  .question-card {
    background: linear-gradient(145deg, rgba(139,92,246,0.15), rgba(236,72,153,0.1));
    border: 1px solid rgba(139,92,246,0.3);
    border-radius: 20px;
    padding: 20px 16px;
    text-align: center;
    flex-shrink: 0;
  }
  .question-label {
    font-size: 12px;
    color: #c4b5fd;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .target-word {
    font-size: clamp(36px, 11vw, 56px);
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1;
    background: linear-gradient(135deg, #fff, #fbbf24);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: popIn 0.4s cubic-bezier(.2,.9,.3,1.4);
  }
  @keyframes popIn {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .timer-bar {
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 12px;
  }
  .timer-fill {
    height: 100%;
    width: 100%;
    background: #22c55e;
    border-radius: 2px;
    transition: width 0.1s linear, background 0.3s;
  }
  .timer-fill.warn { background: #f59e0b; }
  .timer-fill.danger { background: #ef4444; }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    flex: 1;
    align-content: center;
  }
  .option-btn {
    padding: 22px 12px;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    color: #f1f5f9;
    font-family: inherit;
    font-size: clamp(16px, 4.5vw, 20px);
    font-weight: 800;
    letter-spacing: 1px;
    cursor: pointer;
    transition: transform 0.08s, background 0.15s, border-color 0.15s;
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.15;
  }
  .option-btn:active:not(:disabled) {
    transform: scale(0.97);
    background: rgba(255,255,255,0.12);
  }
  .option-btn:disabled { cursor: not-allowed; }
  .option-btn.correct {
    background: rgba(34,197,94,0.25);
    border-color: #22c55e;
    color: #86efac;
    animation: correctPulse 0.5s;
  }
  @keyframes correctPulse { 50% { transform: scale(1.05); } }
  .option-btn.wrong {
    background: rgba(239,68,68,0.25);
    border-color: #ef4444;
    color: #fca5a5;
    animation: shake 0.4s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  .option-btn.reveal {
    background: rgba(34,197,94,0.15);
    border-color: #22c55e;
    color: #86efac;
  }
  .option-btn.faded { opacity: 0.35; }
  .feedback {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    min-height: 24px;
    color: #22c55e;
    transition: opacity 0.2s;
  }
  .feedback.hidden { opacity: 0; }
  .feedback.bad { color: #ef4444; }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    animation: fadeIn 0.3s;
  }
  .overlay.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .result-card {
    background: linear-gradient(145deg, #1e293b, #312e81);
    border: 1px solid rgba(139,92,246,0.4);
    border-radius: 24px;
    padding: 28px 22px;
    text-align: center;
    max-width: 320px;
    width: 100%;
    animation: pop 0.4s cubic-bezier(.2,.9,.3,1.4);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  @keyframes pop {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .result-emoji { font-size: 60px; line-height: 1; margin-bottom: 8px; }
  .result-card h2 {
    margin: 0 0 6px;
    font-size: 24px;
    background: linear-gradient(90deg, #fbbf24, #f472b6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .result-card .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 18px; }
  .result-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-box {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px;
  }
  .stat-box .stat-val {
    font-size: 22px;
    font-weight: 900;
    color: #fbbf24;
    line-height: 1;
  }
  .stat-box .stat-lbl {
    font-size: 11px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }
  .play-again {
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, #8b5cf6, #ec4899);
    color: #fff;
    border: 0;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.08s, box-shadow 0.1s;
    box-shadow: 0 6px 20px rgba(236,72,153,0.4);
  }
  .play-again:active {
    transform: translateY(2px);
    box-shadow: 0 3px 12px rgba(236,72,153,0.4);

  const TOTAL_QUESTIONS = 20;
  const TIME_PER_QUESTION = 10;
  const BASE_POINTS = 10;
  const STREAK_BONUS = 5;

  const state = {
    questions: [],
    currentIndex: 0,
    score: 0,
    correct: 0,
    streak: 0,
    bestStreak: 0,
    answered: false,
    timeLeft: TIME_PER_QUESTION,
    timerId: null
  };

  const targetWordEl = document.getElementById("targetWord");
  const optionsEl    = document.getElementById("options");
  const scoreBadge   = document.getElementById("scoreBadge");
  const streakBadge  = document.getElementById("streakBadge");
  const qProgress    = document.getElementById("qProgress");
  const correctCount = document.getElementById("correctCount");
  const progressFill = document.getElementById("progressFill");
  const timerFill    = document.getElementById("timerFill");
  const timerWrap    = document.getElementById("timerWrap");
  const feedbackEl   = document.getElementById("feedback");
  const gameOverEl   = document.getElementById("gameOver");

  let audioCtx = null;
  function playTone(freq, duration = 0.12, type = "sine", volume = 0.15) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }
  function playCorrect() { playTone(523.25); setTimeout(() => playTone(659.25), 80); setTimeout(() => playTone(783.99), 160); }
  function playWrong()   { playTone(200, 0.2, "sawtooth", 0.12); }
  function playWin()     { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f), i * 100)); }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildQuestions() {
    const shuffled = shuffle(RHYME_BANK).slice(0, TOTAL_QUESTIONS);
    return shuffled.map(q => {
      const options = shuffle([q.rhyme, ...q.wrongs]);
      return { target: q.word, rhyme: q.rhyme, options };
    });
  }

  function startGame() {
    state.questions = buildQuestions();
    state.currentIndex = 0;
    state.score = 0;
    state.correct = 0;
    state.streak = 0;
    state.bestStreak = 0;
    gameOverEl.classList.add("hidden");
    updateStatsUI();
    renderQuestion();
  }

  function renderQuestion() {
    if (state.currentIndex >= state.questions.length) { endGame(); return; }
    state.answered = false;
    const q = state.questions[state.currentIndex];
    targetWordEl.textContent = q.target;
    targetWordEl.style.animation = "none";
    void targetWordEl.offsetWidth;
    targetWordEl.style.animation = "";

    optionsEl.innerHTML = "";
    q.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "option-btn";
      btn.textContent = opt;
      btn.addEventListener("click", () => handleAnswer(opt, btn));
      optionsEl.appendChild(btn);
    });
    hideFeedback();
    updateProgressUI();
    startTimer();
  }

  function startTimer() {
    stopTimer();
    state.timeLeft = TIME_PER_QUESTION;
    updateTimerUI();
    timerWrap.style.opacity = "1";
    state.timerId = setInterval(() => {
      state.timeLeft -= 0.1;
      if (state.timeLeft <= 0) {
        state.timeLeft = 0;
        updateTimerUI();
        timeUp();
      } else {
        updateTimerUI();
      }
    }, 100);
  }

  function stopTimer() {
    if (state.timerId) { clearInterval(state.timerId); state.timerId = null; }
  }

  function updateTimerUI() {
    const pct = (state.timeLeft / TIME_PER_QUESTION) * 100;
    timerFill.style.width = pct + "%";
    timerFill.classList.remove("warn", "danger");
    if (pct < 30) timerFill.classList.add("danger");
    else if (pct < 60) timerFill.classList.add("warn");
  }

  function timeUp() {
    if (state.answered) return;
    state.answered = true;
    stopTimer();
    state.streak = 0;
    updateStatsUI();
    revealCorrectAnswer();
    playWrong();
    showFeedback("⏰ Time up! Sahi: " + state.questions[state.currentIndex].rhyme, true);
    setTimeout(() => { state.currentIndex++; renderQuestion(); }, 1800);
  }

  function handleAnswer(choice, btn) {
    if (state.answered) return;
    state.answered = true;
    stopTimer();
    const q = state.questions[state.currentIndex];
    const isCorrect = choice === q.rhyme;

    if (isCorrect) {
      btn.classList.add("correct");
      const bonus = state.streak * STREAK_BONUS;
      const points = BASE_POINTS + bonus;
      state.score += points;
      state.correct++;
      state.streak++;
      if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      playCorrect();
      showFeedback("✓ Correct! +" + points + (bonus ? " (streak 🔥)" : ""));
      updateStatsUI(true);
      setTimeout(() => { state.currentIndex++; renderQuestion(); }, 1000);
    } else {
      btn.classList.add("wrong");
      state.streak = 0;
      Array.from(optionsEl.children).forEach(el => {
        if (el.textContent === q.rhyme) el.classList.add("reveal");
        else if (el !== btn) el.classList.add("faded");
      });
      btn.classList.add("faded");
      playWrong();
      showFeedback("✗ Galat! Sahi jawab: " + q.rhyme, true);
      updateStatsUI();
      setTimeout(() => { state.currentIndex++; renderQuestion(); }, 1800);
    }
  }

  function revealCorrectAnswer() {
    const q = state.questions[state.currentIndex];
    Array.from(optionsEl.children).forEach(el => {
      if (el.textContent === q.rhyme) el.classList.add("reveal");
      else el.classList.add("faded");
    });
  }

  function updateStatsUI(bumpScore = false) {
    scoreBadge.textContent = "⭐ " + state.score;
    streakBadge.textContent = "🔥 " + state.streak;
    streakBadge.classList.toggle("fire", state.streak >= 3);
    if (bumpScore) {
      scoreBadge.classList.remove("bump");
      void scoreBadge.offsetWidth;
      scoreBadge.classList.add("bump");
    }
  }

  function updateProgressUI() {
    const total = state.questions.length;
    qProgress.textContent = `Question ${state.currentIndex + 1} / ${total}`;
    correctCount.textContent = state.correct + " correct";
    progressFill.style.width = ((state.currentIndex) / total) * 100 + "%";
  }

  function showFeedback(text, bad = false) {
    feedbackEl.textContent = text;
    feedbackEl.classList.remove("hidden", "bad");
    if (bad) feedbackEl.classList.add("bad");
  }
  function hideFeedback() { feedbackEl.classList.add("hidden"); }

  function endGame() {
    stopTimer();
    progressFill.style.width = "100%";
    playWin();
    const total = state.questions.length;
    const accuracy = Math.round((state.correct / total) * 100);
    document.getElementById("finalScore").textContent = state.score;
    document.getElementById("finalCorrect").textContent = `${state.correct}/${total}`;
    document.getElementById("finalAccuracy").textContent = accuracy + "%";
    document.getElementById("finalStreak").textContent = state.bestStreak;

    let emoji = "🎉", title = "Great Job!", subtitle = "Aapne game complete kiya!";
    if (accuracy === 100) { emoji = "🏆"; title = "Perfect!"; subtitle = "Saare jawab sahi! Kamaal!"; }
    else if (accuracy >= 80) { emoji = "🌟"; title = "Excellent!"; subtitle = "Bahut badhiya performance!"; }
    else if (accuracy >= 60) { emoji = "👍"; title = "Good Job!"; subtitle = "Aur practice karo!"; }
    else if (accuracy >= 40) { emoji = "💪"; title = "Keep Trying!"; subtitle = "Thoda aur mehnat karo!"; }
    else { emoji = "📚"; title = "Practice More!"; subtitle = "Rhymes yaad karo, phir try karo!"; }

    document.getElementById("resultEmoji").textContent = emoji;
    document.getElementById("resultTitle").textContent = title;
    document.getElementById("resultSubtitle").textContent = subtitle;
    gameOverEl.classList.remove("hidden");
  }

  document.getElementById("playAgainBtn").addEventListener("click", startGame);
  startGame();
</script>
</body>
</html>
