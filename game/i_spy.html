<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I Spy — खोजो और जीतो</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --accent: #00e5ff;
    --accent2: #7c4dff;
    --good: #00e676;
    --bad: #ff5252;
    --gold: #ffd740;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, 'Noto Sans Devanagari', sans-serif;
    background: #0a0a1a;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(124,77,255,0.28), transparent 55%),
      radial-gradient(ellipse at 80% 100%, rgba(0,229,255,0.22), transparent 55%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    overflow: hidden;
    min-height: 100dvh;
  }

  /* ---------- APP LAYOUT ---------- */
  .app {
    width: min(100%, 860px);
    height: min(100dvh - 24px, 780px);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ---------- HUD ---------- */
  .hud {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .stat {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  .label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    opacity: 0.55;
    font-weight: 700;
  }
  .value {
    font-size: 1.35rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
  }
  .value.low { color: var(--bad); animation: blink 0.8s infinite; }
  @keyframes blink { 50% { opacity: 0.4; } }

  /* ---------- TIME BAR ---------- */
  .time-track {
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
    margin: 0 4px;
  }
  .time-fill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: var(--good);
    transition: background 0.3s;
  }

  /* ---------- CLUE BAR ---------- */
  .clue-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 18px;
    background: linear-gradient(90deg, rgba(124,77,255,0.22), rgba(0,229,255,0.15));
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    min-height: 58px;
  }
  .clue-text {
    font-size: clamp(0.95rem, 2.6vw, 1.15rem);
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .clue-text.pop { animation: cluePop 0.35s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes cluePop {
    0% { transform: scale(0.85); opacity: 0.5; }
    100% { transform: scale(1); opacity: 1; }
  }
  .streak {
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.25s, transform 0.25s;
    background: linear-gradient(135deg, #ff6b00, #ffd740);
    color: #1a1a1a;
    padding: 5px 12px;
    border-radius: 999px;
    font-weight: 900;
    font-size: 0.82rem;
    white-space: nowrap;
  }
  .streak.show { opacity: 1; transform: scale(1); }

  /* ---------- GAME AREA ---------- */
  .game-area {
    position: relative;
    flex: 1;
    min-height: 0;
    border-radius: 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
  }

  /* ---------- EMOJI ---------- */
  .emoji {
    position: absolute;
    translate: -50% -50%;
    width: clamp(52px, 13vw, 74px);
    height: clamp(52px, 13vw, 74px);
    font-size: clamp(1.6rem, 7vw, 2.3rem);
    display: grid;
    place-items: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    font-family: inherit;
    transition: transform 0.15s, background 0.15s, box-shadow 0.2s, opacity 0.3s;
    animation: popIn 0.35s cubic-bezier(.2,.9,.3,1.4) backwards;
    user-select: none;
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.3); }
    to   { opacity: 1; transform: scale(1); }
  }
  @media (hover: hover) {
    .emoji:hover { transform: scale(1.12); background: rgba(255,255,255,0.14); }
  }
  .emoji:active { transform: scale(0.95); }

  .emoji.correct {
    animation: correctPop 0.3s ease forwards;
    pointer-events: none;
    z-index: 10;
    border-color: var(--good);
  }
  @keyframes correctPop {
    0%   { transform: scale(1); }
    35%  { transform: scale(1.35); filter: brightness(2.2); }
    100% { transform: scale(0); opacity: 0; }
  }

  .emoji.wrong { animation: shake 0.4s; border-color: var(--bad); }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-9px); }
    40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .emoji.hint {
    border-color: rgba(255,215,64,0.9);
    background: rgba(255,215,64,0.15);
    animation: hintGlow 1s ease-in-out infinite;
  }
  @keyframes hintGlow {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,215,64,0.6); }
    50%     { box-shadow: 0 0 26px 7px rgba(255,215,64,0.45); }
  }

  .emoji.dim { opacity: 0.2; filter: grayscale(1); }
  .emoji.reveal {
    opacity: 1;
    filter: none;
    border-color: var(--good);
    box-shadow: 0 0 26px rgba(0,230,118,0.6);
    animation: revealPulse 1s ease-in-out infinite;
  }
  @keyframes revealPulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.1); }
  }

  /* ---------- FLOATERS & PARTICLES ---------- */
  .floater {
    position: absolute;
    translate: -50% -50%;
    font-weight: 900;
    font-size: 1.1rem;
    pointer-events: none;
    z-index: 20;
    white-space: nowrap;
    animation: floatUp 0.9s ease-out forwards;
  }
  .floater.gain { color: var(--good); text-shadow: 0 0 12px rgba(0,230,118,0.8); }
  .floater.penalty { color: var(--bad); text-shadow: 0 0 12px rgba(255,82,82,0.8); }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(0) scale(0.6); }
    20%  { opacity: 1; transform: translateY(-10px) scale(1.15); }
    100% { opacity: 0; transform: translateY(-64px) scale(1); }
  }

  .particle {
    position: absolute;
    translate: -50% -50%;
    width: 9px; height: 9px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 15;
    animation: fly 0.7s ease-out forwards;
  }
  @keyframes fly {
    0%   { transform: scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* ---------- OVERLAY ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 6, 20, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: grid;
    place-items: center;
    padding: 20px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay-card {
    width: min(100%, 400px);
    background: linear-gradient(160deg, rgba(32,32,64,0.97), rgba(14,14,32,0.97));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 26px;
    padding: 32px 26px;
    text-align: center;
    box-shadow: 0 24px 70px rgba(0,0,0,0.6);
    transform: scale(0.88);
    transition: transform 0.35s cubic-bezier(.2,.9,.3,1.35);
  }
  .overlay.show .overlay-card { transform: scale(1); }

  .overlay-icon { font-size: 3rem; margin-bottom: 6px; }
  .overlay-title {
    font-size: 1.8rem;
    font-weight: 900;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #00e5ff, #7c4dff, #ffd740);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .overlay-sub {
    font-size: 0.92rem;
    opacity: 0.75;
    line-height: 1.5;
    margin-bottom: 20px;
  }
  .overlay-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }
  .ov-stat {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .ov-stat span { font-size: 0.7rem; opacity: 0.55; text-transform: uppercase; letter-spacing: 0.8px; }
  .ov-stat strong { font-size: 1.15rem; font-weight: 800; }

  .btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(135deg, #7c4dff, #00e5ff);
    color: #fff;
    font-size: 1.05rem;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 8px 26px rgba(124,77,255,0.4);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(124,77,255,0.55); }
  .btn:active { transform: scale(0.97); }

  @media (max-width: 420px) {
    .overlay-card { padding: 26px 20px; }
    .overlay-title { font-size: 1.5rem; }
    .value { font-size: 1.15rem; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="hud">
    <div class="stat"><span class="label">स्कोर</span><span class="value" id="scoreVal">0</span></div>
    <div class="stat"><span class="label">समय</span><span class="value" id="timeVal">60</span></div>
    <div class="stat"><span class="label">बेस्ट</span><span class="value" id="bestVal">0</span></div>
  </header>

  <div class="time-track"><div class="time-fill" id="timeFill"></div></div>

  <div class="clue-bar">
    <span class="clue-text" id="clueText">तैयार हो? 🔍</span>
    <span class="streak" id="streakEl">🔥 x2</span>
  </div>

  <div class="game-area" id="gameArea"></div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="overlay-icon" id="ovIcon">🔍</div>
    <h1 class="overlay-title" id="ovTitle">I Spy</h1>
    <p class="overlay-sub" id="ovSub"></p>
    <div class="overlay-stats" id="ovStats"></div>
    <button class="btn" id="ovBtn"></button>
  </div>
</div>

<script>
/* ================= OBJECT POOL ================= */
const OBJECTS = [
  { emoji: '🍎', name: 'लाल सेब' },
  { emoji: '🚗', name: 'नीली कार' },
  { emoji: '🐶', name: 'भूरा कुत्ता' },
  { emoji: '🐱', name: 'संतरी बिल्ली' },
  { emoji: '🌻', name: 'पीला सूरजमुखी' },
  { emoji: '🍇', name: 'बैंगनी अंगूर' },
  { emoji: '🍌', name: 'पीला केला' },
  { emoji: '🐸', name: 'हरा मेंढक' },
  { emoji: '🦋', name: 'रंगीन तितली' },
  { emoji: '⚽', name: 'सफ़ेद फुटबॉल' },
  { emoji: '🎈', name: 'लाल गुब्बारा' },
  { emoji: '🍕', name: 'चीज़ वाला पिज़्ज़ा' },
  { emoji: '🐟', name: 'नीली मछली' },
  { emoji: '🚀', name: 'अंतरिक्ष रॉकेट' },
  { emoji: '🍦', name: 'ठंडी आइसक्रीम' },
  { emoji: '🐼', name: 'काला-सफ़ेद पांडा' },
  { emoji: '🦁', name: 'शेर' },
  { emoji: '🍓', name: 'लाल स्ट्रॉबेरी' },
  { emoji: '🥕', name: 'संतरी गाजर' },
  { emoji: '🌈', name: 'रंगीन इंद्रधनुष' },
  { emoji: '🍉', name: 'लाल तरबूज़' },
  { emoji: '🍒', name: 'लाल चेरी' },
  { emoji: '🐧', name: 'काला-सफ़ेद पेंगुइन' },
  { emoji: '🌹', name: 'लाल गुलाब' },
  { emoji: '🦊', name: 'संतरी लोमड़ी' },
  { emoji: '🍍', name: 'पीला अनानास' },
  { emoji: '🐢', name: 'हरा कछुआ' },
];

const BEST_KEY = 'ispy_best_v3';
const MAX_TIME = 60;

/* ================= STATE ================= */
const state = {
  status: 'idle',   // idle | playing | over
  score: 0,
  best: 0,
  streak: 0,
  bestStreak: 0,
  timeLeft: MAX_TIME,
  correctCount: 0,
  target: null,
  emojiList: [],
  locked: false,
  hintTimer: null,
};

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const gameArea = $('gameArea');
const overlay  = $('overlay');
const clueText = $('clueText');
const streakEl = $('streakEl');
const scoreVal = $('scoreVal');
const timeVal  = $('timeVal');
const bestVal  = $('bestVal');
const timeFill = $('timeFill');

/* ================= AUDIO ================= */
let actx = null;
function initAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type = 'sine', vol = 0.08, delay = 0) {
  if (!actx) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66];
function playCorrect(streak) {
  const f = SCALE[Math.min(streak - 1, SCALE.length - 1)];
  tone(f, 0.12, 'sine', 0.09);
  tone(f * 1.5, 0.15, 'sine', 0.055, 0.07);
}
function playWrong() {
  tone(220, 0.14, 'triangle', 0.07);
  tone(160, 0.2, 'triangle', 0.07, 0.06);
}
function playGameOver() {
  tone(392, 0.22, 'triangle', 0.08);
  tone(329.63, 0.22, 'triangle', 0.08, 0.16);
  tone(261.63, 0.45, 'triangle', 0.08, 0.32);
}
function playStart() {
  tone(523.25, 0.1, 'sine', 0.08);
  tone(659.25, 0.1, 'sine', 0.08, 0.08);
  tone(783.99, 0.16, 'sine', 0.08, 0.16);
}

/* ================= HELPERS ================= */
const shuffle = a => {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
};

function totalForCount(c) {
  if (c < 4)  return 8;
  if (c < 8)  return 12;
  if (c < 12) return 16;
  return 20;
}

/* ================= HUD ================= */
function updateTimeUI() {
  const t = Math.max(0, Math.ceil(state.timeLeft));
  timeVal.textContent = t;
  const pct = (state.timeLeft / MAX_TIME) * 100;
  timeFill.style.width = Math.max(0, pct) + '%';
  timeFill.style.background =
    pct < 25 ? 'var(--bad)' : pct < 50 ? 'var(--gold)' : 'var(--good)';
  timeVal.classList.toggle('low', pct < 25 && state.status === 'playing');
}

function updateHUD() {
  scoreVal.textContent = state.score;
  bestVal.textContent = Math.max(state.best, state.score);
  if (state.streak >= 2) {
    streakEl.textContent = `🔥 x${state.streak}`;
    streakEl.classList.add('show');
  } else {
    streakEl.classList.remove('show');
  }
  updateTimeUI();
}

/* ================= RENDER ================= */
function layoutEmojis(pool) {
  gameArea.innerHTML = '';
  state.emojiList = [];
  const n = pool.length;
  const cols = 4;
  const rows = Math.ceil(n / cols);

  pool.forEach((obj, i) => {
    const r = Math.floor(i / cols);
    const c = i % cols;
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'emoji';
    el.textContent = obj.emoji;
    el.style.left = ((c + 0.5) / cols * 100) + '%';
    el.style.top  = ((r + 0.5) / rows * 100) + '%';
    el.style.animationDelay = (i * 25) + 'ms';
    el.dataset.emoji = obj.emoji;
    el.setAttribute('aria-label', obj.name);
    el.addEventListener('click', () => onPick(el, obj));
    gameArea.appendChild(el);
    state.emojiList.push({ el, obj });
  });
}

/* ================= ROUND ================= */
function newRound() {
  state.locked = false;
  clearTimeout(state.hintTimer);

  const target = OBJECTS[Math.floor(Math.random() * OBJECTS.length)];
  state.target = target;
  clueText.textContent = `मुझे दिखा... ${target.name}`;
  clueText.classList.add('pop');
  setTimeout(() => clueText.classList.remove('pop'), 320);

  const total = totalForCount(state.correctCount);
  const others = shuffle(OBJECTS.filter(o => o.emoji !== target.emoji)).slice(0, total - 1);
  const pool = shuffle([target, ...others]);
  layoutEmojis(pool);

  state.hintTimer = setTimeout(() => {
    const t = state.emojiList.find(e => e.obj.emoji === state.target.emoji);
    if (t) t.el.classList.add('hint');
  }, 3500);
}

/* ================= CLICK HANDLING ================= */
function onPick(el, obj) {
  if (state.status !== 'playing' || state.locked) return;
  if (obj.emoji === state.target.emoji) handleCorrect(el);
  else handleWrong(el);
}

function handleCorrect(el) {
  state.locked = true;
  clearTimeout(state.hintTimer);
  el.classList.remove('hint');
  el.classList.add('correct');

  const cx = el.offsetLeft, cy = el.offsetTop;
  burst(cx, cy);

  state.streak++;
  state.bestStreak = Math.max(state.bestStreak, state.streak);
  state.correctCount++;

  const gain = 10 + Math.floor(state.streak / 2) * 5;
  state.score += gain;
  state.timeLeft = Math.min(MAX_TIME, state.timeLeft + 2);

  floatText(cx, cy, '+' + gain, 'gain');
  playCorrect(state.streak);
  updateHUD();

  setTimeout(() => {
    if (state.status === 'playing') newRound();
  }, 320);
}

function handleWrong(el) {
  el.classList.add('wrong');
  setTimeout(() => el.classList.remove('wrong'), 420);

  const cx = el.offsetLeft, cy = el.offsetTop;
  state.streak = 0;
  state.timeLeft = Math.max(0, state.timeLeft - 3);
  floatText(cx, cy, '-3s', 'penalty');
  playWrong();
  updateHUD();

  if (state.timeLeft <= 0) endGame();
}

/* ================= FX ================= */
function floatText(x, y, text, cls) {
  const d = document.createElement('div');
  d.className = 'floater ' + cls;
  d.textContent = text;
  d.style.left = x + 'px';
  d.style.top  = y + 'px';
  gameArea.appendChild(d);
  setTimeout(() => d.remove(), 950);
}

function burst(cx, cy) {
  const colors = ['#00e5ff', '#7c4dff', '#ffd740', '#00e676', '#ff4081'];
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const ang = (Math.PI * 2 * i) / 14 + Math.random() * 0.5;
    const dist = 45 + Math.random() * 55;
    p.style.left = cx + 'px';
    p.style.top  = cy + 'px';
    p.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
    p.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(1) + 'px');
    p.style.background = colors[i % colors.length];
    gameArea.appendChild(p);
    setTimeout(() => p.remove(), 720);
  }
}

/* ================= GAME FLOW ================= */
function startGame() {
  initAudio();
  playStart();
  overlay.classList.remove('show');

  state.status = 'playing';
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.timeLeft = MAX_TIME;
  state.correctCount = 0;
  state.locked = false;
  lastTs = 0;

  updateHUD();
  newRound();
}

function endGame() {
  if (state.status !== 'playing') return;
  state.status = 'over';
  state.locked = true;
  clearTimeout(state.hintTimer);

  const prevBest = state.best;
  const isNew = state.score > prevBest;
  if (isNew) {
    state.best = state.score;
    try { localStorage.setItem(BEST_KEY, String(state.best)); } catch (e) {}
  }

  document.querySelectorAll('.emoji').forEach(e => {
    e.classList.add('dim');
    if (e.dataset.emoji === state.target.emoji) {
      e.classList.remove('dim', 'hint');
      e.classList.add('reveal');
    }
  });

  updateHUD();
  playGameOver();
  setTimeout(() => showOverOverlay(isNew), 750);
}

/* ================= OVERLAY ================= */
function openOverlay({ icon, title, sub, stats, btn, onClick }) {
  $('ovIcon').textContent = icon;
  $('ovTitle').textContent = title;
  $('ovSub').textContent = sub;

  const s = $('ovStats');
  s.innerHTML = '';
  (stats || []).forEach(([k, v]) => {
    const d = document.createElement('div');
    d.className = 'ov-stat';
    const sp = document.createElement('span'); sp.textContent = k;
    const st = document.createElement('strong'); st.textContent = v;
    d.append(sp, st);
    s.appendChild(d);
  });

  const b = $('ovBtn');
  b.textContent = btn;
  b.onclick = onClick;

  overlay.classList.add('show');
}

function showStartOverlay() {
  openOverlay({
    icon: '🔍',
    title: 'I Spy',
    sub: 'स्क्रीन पर छिपी चीज़ें ढूँढो, तेज़ रहो और स्कोर बनाओ!',
    stats: [['बेस्ट स्कोर', state.best], ['कुल समय', MAX_TIME + 's']],
    btn: '▶  खेलना शुरू करें',
    onClick: startGame,
  });
}

function showOverOverlay(isNew) {
  openOverlay({
    icon: isNew ? '🏆' : '⏱️',
    title: isNew ? 'नया रिकॉर्ड!' : 'समय खत्म!',
    sub: isNew ? 'शानदार प्रदर्शन! 🎉' : 'अच्छी कोशिश — फिर से खेलो!',
    stats: [
      ['स्कोर', state.score],
      ['सही जवाब', state.correctCount],
      ['बेस्ट स्ट्रीक', state.bestStreak],
      ['बेस्ट स्कोर', state.best],
    ],
    btn: '🔄  फिर से खेलें',
    onClick: startGame,
  });
}

/* ================= MAIN LOOP ================= */
let lastTs = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (state.status !== 'playing') { lastTs = 0; return; }
  if (!lastTs) { lastTs = ts; return; }

  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.25) dt = 0.25;   // tab-switch safety

  state.timeLeft -= dt;
  if (state.timeLeft <= 0) {
    state.timeLeft = 0;
    updateTimeUI();
    endGame();
    return;
  }
  updateTimeUI();
}

/* ================= INIT ================= */
(function init() {
  state.best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0;
  updateHUD();
  showStartOverlay();
  requestAnimationFrame(loop);
})();
</script>
