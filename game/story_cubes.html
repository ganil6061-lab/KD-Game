<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Cubes</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#ff9a9e,#fad0c4);font-family:'Segoe UI',system-ui,sans-serif}
.app{width:100%;max-width:420px;height:746px;max-height:100vh;background:#fffbf5;border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
header{padding:16px;background:linear-gradient(135deg,#f97316,#ec4899);color:#fff;text-align:center}
header h1{font-size:22px}
.sub{font-size:13px;opacity:.9;margin-top:6px}
.cubes{display:flex;justify-content:center;gap:10px;padding:20px;flex-wrap:wrap;min-height:100px}
.cube{width:64px;height:64px;background:linear-gradient(135deg,#fff,#f3f4f6);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 6px 0 #d1d5db,0 8px 16px rgba(0,0,0,.1);animation:roll .6s}
@keyframes roll{0%{transform:rotate(0) scale(0)}50%{transform:rotate(360deg) scale(1.2)}100%{transform:rotate(360deg) scale(1)}}
.roll-btn{margin:0 20px;padding:16px;border:none;border-radius:16px;background:linear-gradient(135deg,#f97316,#ec4899);color:#fff;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(236,72,153,.4)}
.roll-btn:active{transform:scale(.97)}
.starter{margin:12px 20px;padding:12px;background:#fef3c7;border-radius:12px;text-align:center;font-size:14px;font-weight:600;color:#92400e;cursor:pointer}
textarea{flex:1;margin:0 20px;padding:12px;border:2px solid #e5e7eb;border-radius:12px;font-family:inherit;font-size:15px;resize:none;outline:none}
textarea:focus{border-color:#ec4899}
.save-btn{margin:12px 20px;padding:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.stories{max-height:120px;overflow-y:auto;margin:0 20px 20px;padding:10px;background:#f9fafb;border-radius:12px;font-size:13px}
.story-item{padding:8px;border-bottom:1px solid #e5e7eb;display:flex;gap:6px;align-items:center}
.story-item:last-child{border-bottom:none}
.story-emoji{font-size:18px}
.story-text{flex:1;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story-date{font-size:11px;color:#9ca3af}
</style>
</head>
<body>
<div class="app">
  <header><h1>📖 Story Cubes</h1><div class="sub">Roll & write a story!</div></header>
  <div class="cubes" id="cubes"></div>
  <button class="roll-btn" id="roll">🎲 Roll Dice</button>
  <div class="starter" id="starter" style="display:none">✨ Surprise Me</div>
  <textarea id="story" placeholder="Once upon a time..."></textarea>
  <button class="save-btn" id="save">💾 Save Story</button>
  <div class="stories" id="stories"></div>
</div>
<script>
const EMOJIS=['🐉','🚀','🌙','🐶','👑','🏰','🔥','🌊','🦋','⭐','🌈','🗡️','🦄','🌳','🧚','🎭'];
const STARTERS=['Once upon a time,','In a magical land,','Long ago,','One sunny day,','In a hidden forest,','Far far away,','Under the starry sky,','At the edge of the world,'];
const cubesEl=document.getElementById('cubes'),starterEl=document.getElementById('starter'),storyEl=document.getElementById('story'),storiesEl=document.getElementById('stories');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function roll(){
  const selected=shuffle([...EMOJIS]).slice(0,4);
  cubesEl.innerHTML='';
  selected.forEach((e,i)=>{
    const c=document.createElement('div');c.className='cube';c.textContent=e;c.style.animationDelay=(i*.1)+'s';
    cubesEl.appendChild(c);
  });
  starterEl.style.display='block';
}
starterEl.onclick=()=>{
  const s=STARTERS[Math.floor(Math.random()*STARTERS.length)];
  storyEl.value=s+' '+storyEl.value;
  storyEl.focus();
};
document.getElementById('roll').onclick=roll;
document.getElementById('save').onclick=()=>{
  const text=storyEl.value.trim();
  if(!text){alert('Please write a story first!');return}
  const emojis=[...cubesEl.children].map(c=>c.textContent).join('');
  const stories=JSON.parse(localStorage.getItem('storyCubes')||'[]');
  stories.unshift({emojis,text,date:new Date().toLocaleDateString()});
  localStorage.setItem('storyCubes',JSON.stringify(stories.slice(0,20)));
  storyEl.value='';renderStories();
};
function renderStories(){
  const stories=JSON.parse(localStorage.getItem('storyCubes')||'[]');
  storiesEl.innerHTML=stories.length?'':'<div style="text-align:center;color:#9ca3af;padding:10px">No stories yet</div>';
  stories.forEach(s=>{
    const d=document.createElement('div');d.className='story-item';
    d.innerHTML=`<span class="story-emoji">${s.emojis}</span><span class="story-text">${s.text}</span><span class="story-date">${s.date}</span>`;
    storiesEl.appendChild(d);
  });
}
renderStories();roll();
</script>
</body>
</html>
