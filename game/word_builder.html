<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Word Builder</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    color: #f1f5f9;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: 12px 14px;
    gap: 10px;
    max-width: 500px;
    margin: 0 auto;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header h1 { margin: 0; font-size: 18px; letter-spacing: 0.5px; }
  .score-badge {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    color: #38bdf8;
    transition: transform 0.15s;
  }
  .score-badge.bump { animation: bump 0.3s; }
  @keyframes bump { 50% { transform: scale(1.2); } }

  .emoji-card {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 14px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .emoji {
    font-size: clamp(56px, 16vw, 80px);
    line-height: 1;
    filter: drop-shadow(0 4px 12px rgba(56, 189, 248, 0.25));
    animation: pop-in 0.4s cubic-bezier(.2,.9,.3,1.4);
  }
  @keyframes pop-in {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .word-len {
    font-size: 13px;
    color: #94a3b8;
    font-weight: 600;
  }

  .slots {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    min-height: 52px;
    flex-shrink: 0;
  }
  .slot {
    width: 46px;
    height: 46px;
    border-radius: 10px;
    background: #1e293b;
    border: 2px dashed #475569;
    color: #f1f5f9;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s, background 0.15s, border-color 0.15s;
    padding: 0;
    font-family: inherit;
  }
  .slot.filled {
    background: #2563eb;
    border: 2px solid #3b82f6;
  }
  .slot:active:not(:disabled) { transform: scale(0.92); }
  .slot.wrong {
    background: #7f1d1d;
    border-color: #ef4444;
    animation: shake 0.4s;
  }
  .slot.correct {
    background: #166534;
    border-color: #22c55e;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    flex-shrink: 0;
  }
  .actions button {
    padding: 12px 6px;
    background: #1e293b;
    color: #f1f5f9;
    border: 1px solid #334155;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.08s, filter 0.1s;
    font-family: inherit;
  }
  .actions button:active { transform: scale(0.95); filter: brightness(1.2); }
  .actions .warn { background: #7f1d1d; border-color: #991b1b; }

  .pool {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    padding: 4px 0;
    overflow-y: auto;
    flex: 1;
    align-content: flex-start;
  }
  .tile {
    width: 46px;
    height: 46px;
    border-radius: 10px;
    background: linear-gradient(180deg, #475569, #334155);
    border: 2px solid #64748b;
    color: #f1f5f9;
    font-size: 22px;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s, opacity 0.2s;
    padding: 0;
    font-family: inherit;
    box-shadow: 0 3px 0 #1e293b;
  }
  .tile:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #1e293b;
  }
  .tile.used {
    opacity: 0.15;
    pointer-events: none;
    filter: grayscale(1);
    box-shadow: none;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    animation: fadeIn 0.2s;
  }
  .overlay.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .win-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 26px 22px;
    text-align: center;
    max-width: 300px;
    width: 100%;
    animation: pop 0.35s cubic-bezier(.2,.9,.3,1.4);
  }
  @keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .win-card .big-emoji { font-size: 60px; margin-bottom: 6px; line-height: 1; }
  .win-card h2 { margin: 0 0 8px; font-size: 22px; color: #ef4444; }
  .win-card p { margin: 0 0 18px; color: #94a3b8; font-size: 14px; }
  .win-card p b { color: #f1f5f9; font-size: 18px; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15,23,42,0.95);
    color: #f1f5f9;
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid #334155;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 50;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>📝 Word Builder</h1>
    <div class="score-badge" id="scoreBadge">⭐ <span id="score">0</span></div>
  </div>

  <div class="emoji-card">
    <div class="emoji" id="emoji">🍎</div>
    <div class="word-len" id="wordLen">5 letters</div>
  </div>

  <div class="slots" id="slots"></div>

  <div class="actions">
    <button id="backBtn">⌫ Back</button>
    <button id="shuffleBtn">🔀 Shuffle</button>
    <button id="skipBtn" class="warn">⏭ Skip</button>
  </div>

  <div class="pool" id="pool"></div>
</div>

<div class="overlay hidden" id="winOverlay">
  <div class="win-card">
    <div class="big-emoji" id="winEmoji">💥</div>
    <h2>Game Over!</h2>
    <p>Final Score: <b id="winScore">0</b></p>
    <p style="font-size:12px; color:#64748b; margin-top:8px;">Use your device back button to exit.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const WORDS = [
    { emoji: "🍎", word: "APPLE" },
    { emoji: "🍌", word: "BANANA" },
    { emoji: "🐘", word: "ELEPHANT" },
    { emoji: "🚗", word: "CAR" },
    { emoji: "🐕", word: "DOG" },
    { emoji: "🐈", word: "CAT" },
    { emoji: "⭐", word: "STAR" },
    { emoji: "🌙", word: "MOON" },
    { emoji: "🍕", word: "PIZZA" },
    { emoji: "🏠", word: "HOUSE" },
    { emoji: "📚", word: "BOOK" },
    { emoji: "🌳", word: "TREE" },
    { emoji: "🐟", word: "FISH" },
    { emoji: "🦁", word: "LION" },
    { emoji: "🐯", word: "TIGER" },
    { emoji: "🌹", word: "ROSE" },
    { emoji: "⚽", word: "BALL" },
    { emoji: "🚀", word: "ROCKET" },
    { emoji: "🎂", word: "CAKE" },
    { emoji: "🌞", word: "SUN" }
  ];

  const state = {
    word: "",
    emoji: "",
    slots: [],
    pool: [],
    score: 0,
    locked: false,
    gameOver: false,
    strikes: 0
  };

  const usedWords = new Set();

  const slotsEl    = document.getElementById("slots");
  const poolEl     = document.getElementById("pool");
  const emojiEl    = document.getElementById("emoji");
  const wordLenEl  = document.getElementById("wordLen");
  const scoreEl    = document.getElementById("score");
  const scoreBadge = document.getElementById("scoreBadge");
  const winOverlay = document.getElementById("winOverlay");
  const toastEl    = document.getElementById("toast");

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pickWord() {
    let pool = WORDS.map((w, i) => ({ ...w, i })).filter(w => !usedWords.has(w.i));
    if (!pool.length) {
      usedWords.clear();
      pool = WORDS.map((w, i) => ({ ...w, i }));
    }
    const pick = pool[Math.floor(Math.random() * pool.length)];
    usedWords.add(pick.i);
    return pick;
  }

  function makePool(word) {
    const letters = [...word];
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    for (let i = 0; i < 3; i++) {
      letters.push(alphabet[Math.floor(Math.random() * 26)]);
    }
    return shuffle(letters).map((letter, id) => ({ letter, id, used: false }));
  }

  function loadWord() {
    if (state.gameOver) return;
    const w = pickWord();
    state.word   = w.word;
    state.emoji  = w.emoji;
    state.slots  = Array(w.word.length).fill(null);
    state.pool   = makePool(w.word);
    state.locked = false;
    winOverlay.classList.add("hidden");
    render();
  }

  function render() {
    if (state.gameOver) return;
    emojiEl.textContent = state.emoji;
    emojiEl.style.animation = "none";
    emojiEl.offsetHeight;
    emojiEl.style.animation = "";

    wordLenEl.textContent = state.word.length + " letters";
    scoreEl.textContent = state.score;
    renderSlots();
    renderPool();
  }

  function renderSlots() {
    slotsEl.innerHTML = "";
    state.slots.forEach((item, i) => {
      const slot = document.createElement("button");
      slot.type = "button";
      slot.className = "slot";
      if (item) {
        slot.classList.add("filled");
        slot.textContent = item.letter;
      }
      if (state.locked || state.gameOver) slot.disabled = true;
      slot.addEventListener("click", () => removeFromSlot(i));
      slotsEl.appendChild(slot);
    });
  }

  function renderPool() {
    poolEl.innerHTML = "";
    state.pool.forEach((item, i) => {
      const tile = document.createElement("button");
      tile.type = "button";
      tile.className = "tile";
      tile.textContent = item.letter;
      if (item.used) tile.classList.add("used");
      if (state.locked || state.gameOver) tile.disabled = true;
      tile.addEventListener("click", () => pickFromPool(i));
      poolEl.appendChild(tile);
    });
  }

  function pickFromPool(poolIdx) {
    if (state.locked || state.gameOver) return;
    const item = state.pool[poolIdx];
    if (!item || item.used) return;
    const emptySlot = state.slots.findIndex(s => s === null);
    if (emptySlot === -1) return;
    state.slots[emptySlot] = item;
    item.used = true;
    renderSlots();
    renderPool();
    checkComplete();
  }

  function removeFromSlot(slotIdx) {
    if (state.locked || state.gameOver) return;
    const item = state.slots[slotIdx];
    if (!item) return;
    item.used = false;
    state.slots[slotIdx] = null;
    renderSlots();
    renderPool();
  }

  function backspace() {
    if (state.locked || state.gameOver) return;
    for (let i = state.slots.length - 1; i >= 0; i--) {
      if (state.slots[i]) {
        removeFromSlot(i);
        return;
      }
    }
    toast("Koi letter nahi hai");
  }

  function shufflePool() {
    if (state.locked || state.gameOver) return;
    state.pool = shuffle(state.pool);
    renderPool();
    toast("Shuffled!");
  }

  function skipWord() {
    if (state.locked || state.gameOver) return;
    triggerGameOver("Word skipped. Game Over!");
  }

  function checkComplete() {
    if (state.slots.some(s => s === null) || state.gameOver) return;

    const guess = state.slots.map(s => s.letter).join("");
    state.locked = true;

    if (guess === state.word) {
      slotsEl.querySelectorAll(".slot").forEach(el => el.classList.add("correct"));
      setTimeout(() => {
        if (state.gameOver) return;
        state.score++;
        scoreEl.textContent = state.score;
        scoreBadge.classList.remove("bump");
        void scoreBadge.offsetWidth;
        scoreBadge.classList.add("bump");
        loadWord();
      }, 400);
    } else {
      slotsEl.querySelectorAll(".slot").forEach(el => el.classList.add("wrong"));
      setTimeout(() => {
        if (state.gameOver) return;
        triggerGameOver("Incorrect guess. Game Over!");
      }, 700);
    }
  }

  function triggerGameOver(reason) {
    if (state.gameOver) return;
    state.gameOver = true;
    state.locked = true;

    // Stop all interactive states
    slotsEl.querySelectorAll(".slot").forEach(el => el.disabled = true);
    poolEl.querySelectorAll(".tile").forEach(el => el.disabled = true);
    document.getElementById("backBtn").disabled = true;
    document.getElementById("shuffleBtn").disabled = true;
    document.getElementById("skipBtn").disabled = true;

    document.getElementById("winScore").textContent = state.score;
    winOverlay.classList.remove("hidden");
  }

  let toastTimer = null;
  function toast(msg) {
    if (state.gameOver) return;
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1400);
  }

  document.getElementById("backBtn").addEventListener("click", backspace);
  document.getElementById("shuffleBtn").addEventListener("click", shufflePool);
  document.getElementById("skipBtn").addEventListener("click", skipWord);

  // Desktop keyboard support
  window.addEventListener("keydown", (e) => {
    if (state.locked || state.gameOver) return;
    const key = e.key.toUpperCase();
    if (/^[A-Z]$/.test(key)) {
      const idx = state.pool.findIndex(p => !p.used && p.letter === key);
      if (idx !== -1) pickFromPool(idx);
      else toast("Yeh letter nahi hai");
    } else if (e.key === "Backspace") {
      e.preventDefault();
      backspace();
    }
  });

  loadWord();
</script>
</body>
</html>
