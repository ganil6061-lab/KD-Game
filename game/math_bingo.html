<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Math Bingo — खेलो और जीतो</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --accent: #00e5ff;
    --accent2: #7c4dff;
    --good: #00e676;
    --bad: #ff5252;
    --gold: #ffd740;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, 'Noto Sans Devanagari', sans-serif;
    background: #0a0a1a;
    background-image:
      radial-gradient(ellipse at 15% 0%, rgba(124,77,255,0.3), transparent 55%),
      radial-gradient(ellipse at 85% 100%, rgba(0,229,255,0.25), transparent 55%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    overflow: hidden;
    min-height: 100dvh;
  }

  .app {
    width: min(100%, 480px);
    height: min(100dvh - 20px, 820px);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ---------- HUD ---------- */
  .hud {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .stat {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
  }
  .label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.55;
    font-weight: 700;
  }
  .value {
    font-size: 1.15rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
  }
  .value.low { color: var(--bad); animation: blink 0.8s infinite; }
  @keyframes blink { 50% { opacity: 0.4; } }

  /* ---------- TIME BAR ---------- */
  .time-track {
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    overflow: hidden;
  }
  .time-fill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: var(--good);
    transition: background 0.3s;
  }

  /* ---------- QUESTION ---------- */
  .question-box {
    background: linear-gradient(135deg, rgba(124,77,255,0.22), rgba(0,229,255,0.15));
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 18px 14px;
    text-align: center;
    position: relative;
    min-height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .question {
    font-size: clamp(1.9rem, 8vw, 2.6rem);
    font-weight: 900;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .question.pop { animation: qPop 0.35s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes qPop {
    0%   { transform: scale(0.8); opacity: 0.4; }
    100% { transform: scale(1); opacity: 1; }
  }
  .question .op { color: var(--accent); margin: 0 4px; }
  .question .eq { color: var(--gold); margin: 0 6px; }

  .streak {
    position: absolute;
    top: 6px;
    right: 8px;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.25s, transform 0.25s;
    background: linear-gradient(135deg, #ff6b00, #ffd740);
    color: #1a1a1a;
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: 900;
    font-size: 0.72rem;
  }
  .streak.show { opacity: 1; transform: scale(1); }

  /* ---------- GRID ---------- */
  .grid-wrap {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: 100%;
    aspect-ratio: 1;
    max-height: 100%;
  }
  .cell {
    font-family: inherit;
    font-size: clamp(1.6rem, 7vw, 2.4rem);
    font-weight: 900;
    display: grid;
    place-items: center;
    background: rgba(255,255,255,0.06);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    color: #fff;
    cursor: pointer;
    padding: 0;
    transition: transform 0.15s, background 0.2s, border-color 0.2s, color 0.2s;
    user-select: none;
    font-variant-numeric: tabular-nums;
  }
  @media (hover: hover) {
    .cell:not(.marked):hover {
      transform: translateY(-2px) scale(1.03);
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.25);
    }
  }
  .cell:active:not(.marked) { transform: scale(0.96); }

  .cell.marked {
    background: linear-gradient(135deg, rgba(0,230,118,0.28), rgba(0,229,255,0.15));
    border-color: var(--good);
    color: var(--good);
    cursor: default;
  }
  .cell.marked::after {
    content: '✓';
    position: absolute;
    top: 4px;
    right: 8px;
    font-size: 0.85rem;
    opacity: 0.9;
  }
  .cell { position: relative; overflow: hidden; }

  .cell.mark-pop { animation: markPop 0.4s cubic-bezier(.2,.9,.3,1.4); }
  @keyframes markPop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.15); box-shadow: 0 0 25px rgba(0,230,118,0.7); }
    100% { transform: scale(1); }
  }

  .cell.bingo-line {
    animation: bingoFlash 1.2s ease-in-out infinite;
  }
  @keyframes bingoFlash {
    0%, 100% {
      box-shadow: 0 0 8px rgba(255,215,64,0.4);
      border-color: var(--gold);
    }
    50% {
      box-shadow: 0 0 28px 6px rgba(255,215,64,0.85);
      border-color: var(--gold);
    }
  }

  .cell.wrong { animation: shake 0.4s; border-color: var(--bad); }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  /* ---------- FX ---------- */
  .floater {
    position: fixed;
    translate: -50% -50%;
    font-weight: 900;
    font-size: 1.15rem;
    pointer-events: none;
    z-index: 200;
    white-space: nowrap;
    animation: floatUp 0.9s ease-out forwards;
  }
  .floater.gain { color: var(--good); text-shadow: 0 0 12px rgba(0,230,118,0.9); }
  .floater.penalty { color: var(--bad); text-shadow: 0 0 12px rgba(255,82,82,0.9); }
  .floater.bonus { color: var(--gold); text-shadow: 0 0 14px rgba(255,215,64,0.9); font-size: 1.4rem; }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translateY(0) scale(0.6); }
    20%  { opacity: 1; transform: translateY(-10px) scale(1.15); }
    100% { opacity: 0; transform: translateY(-70px) scale(1); }
  }

  .particle {
    position: fixed;
    translate: -50% -50%;
    width: 9px; height: 9px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 150;
    animation: fly 0.75s ease-out forwards;
  }
  @keyframes fly {
    0%   { transform: scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }

  /* ---------- BINGO BANNER ---------- */
  .bingo-banner {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    z-index: 300;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .bingo-banner.show { opacity: 1; }
  .bingo-text {
    font-size: clamp(3rem, 16vw, 5.5rem);
    font-weight: 900;
    letter-spacing: 6px;
    background: linear-gradient(90deg, #ffd740, #ff6b00, #ffd740);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 25px rgba(255,215,64,0.7));
    animation: bingoZoom 1.1s cubic-bezier(.2,.9,.3,1.4) forwards;
  }
  @keyframes bingoZoom {
    0%   { transform: scale(0.2) rotate(-12deg); opacity: 0; }
    35%  { transform: scale(1.15) rotate(3deg); opacity: 1; }
    70%  { transform: scale(1) rotate(0); opacity: 1; }
    100% { transform: scale(1.3); opacity: 0; }
  }

  /* ---------- OVERLAY ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(6, 6, 20, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    display: grid;
    place-items: center;
    padding: 18px;
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .overlay-card {
    width: min(100%, 400px);
    background: linear-gradient(160deg, rgba(32,32,64,0.97), rgba(14,14,32,0.97));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 26px 22px;
    text-align: center;
    box-shadow: 0 24px 70px rgba(0,0,0,0.6);
    transform: scale(0.88);
    transition: transform 0.35s cubic-bezier(.2,.9,.3,1.35);
  }
  .overlay.show .overlay-card { transform: scale(1); }

  .overlay-icon { font-size: 2.6rem; margin-bottom: 4px; }
  .overlay-title {
    font-size: 1.7rem;
    font-weight: 900;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #00e5ff, #7c4dff, #ffd740);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .overlay-sub {
    font-size: 0.88rem;
    opacity: 0.75;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .diff-picker {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .diff-btn {
    padding: 12px 6px;
    border: 2px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .diff-btn .ico { font-size: 1.2rem; }
  .diff-btn.active {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(124,77,255,0.35), rgba(0,229,255,0.25));
    box-shadow: 0 0 20px rgba(0,229,255,0.3);
    transform: scale(1.03);
  }

  .overlay-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 18px;
  }
  .ov-stat {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .ov-stat span { font-size: 0.65rem; opacity: 0.55; text-transform: uppercase; letter-spacing: 0.7px; }
  .ov-stat strong { font-size: 1.05rem; font-weight: 800; }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #7c4dff, #00e5ff);
    color: #fff;
    font-size: 1rem;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 8px 24px rgba(124,77,255,0.4);
    margin-bottom: 8px;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(124,77,255,0.55); }
  .btn:active { transform: scale(0.97); }
  .btn.ghost {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: none;
    font-size: 0.85rem;
    padding: 10px;
    margin-bottom: 0;
  }
  .btn.ghost:hover { background: rgba(255,255,255,0.06); box-shadow: none; }

  .sound-toggle {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
    display: grid;
    place-items: center;
    z-index: 10;
  }

  @media (max-width: 380px) {
    .overlay-title { font-size: 1.4rem; }
    .overlay-card { padding: 22px 16px; }
    .diff-btn { font-size: 0.75rem; padding: 10px 4px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="hud">
    <div class="stat"><span class="label">स्कोर</span><span class="value" id="scoreVal">0</span></div>
    <div class="stat"><span class="label">समय</span><span class="value" id="timeVal">90</span></div>
    <div class="stat"><span class="label">बिंगो</span><span class="value" id="bingoVal">0</span></div>
    <div class="stat"><span class="label">बेस्ट</span><span class="value" id="bestVal">0</span></div>
  </header>

  <div class="time-track"><div class="time-fill" id="timeFill"></div></div>

  <div class="question-box">
    <span class="streak" id="streakEl">🔥 x2</span>
    <div class="question" id="questionEl">तैयार?</div>
  </div>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="bingo-banner" id="bingoBanner">
  <div class="bingo-text" id="bingoText">BINGO!</div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <button class="sound-toggle" id="soundToggle" aria-label="आवाज़">🔊</button>
    <div class="overlay-icon" id="ovIcon">🎯</div>
    <h1 class="overlay-title" id="ovTitle">Math Bingo</h1>
    <p class="overlay-sub" id="ovSub"></p>
    <div class="diff-picker" id="diffPicker"></div>
    <div class="overlay-stats" id="ovStats"></div>
    <button class="btn" id="ovBtn"></button>
    <button class="btn ghost" id="ovBtn2" style="display:none;"></button>
  </div>
</div>

<script>
'use strict';

/* ================= CONFIG ================= */
const DIFFICULTIES = {
  easy: {
    name: 'आसान', icon: '🌱',
    min: 1, max: 20,
    ops: ['+', '-'],
    opMax: 10,
  },
  medium: {
    name: 'मध्यम', icon: '⚡',
    min: 1, max: 50,
    ops: ['+', '-', '×'],
    opMax: 12,
  },
  hard: {
    name: 'कठिन', icon: '🔥',
    min: 1, max: 100,
    ops: ['+', '-', '×', '÷'],
    opMax: 12,
  },
};

const START_TIME = 90;
const TIME_CORRECT = 3;
const TIME_WRONG = 5;
const SCORE_BASE = 10;
const SCORE_BINGO = 100;
const SCORE_SUPER = 300;
const BEST_KEY = 'math_bingo_v3';

const LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6],
];

/* ================= STATE ================= */
const state = {
  status: 'idle',
  difficulty: 'easy',
  grid: [],
  marked: new Set(),
  bingoedLines: new Set(),
  question: null,
  score: 0,
  streak: 0,
  bestStreak: 0,
  correctCount: 0,
  bingoCount: 0,
  timeLeft: START_TIME,
  locked: false,
  lastTs: 0,
  best: { easy: 0, medium: 0, hard: 0 },
  soundOn: true,
};

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const gridEl = $('grid');
const questionEl = $('questionEl');
const streakEl = $('streakEl');
const scoreVal = $('scoreVal');
const timeVal = $('timeVal');
const bingoVal = $('bingoVal');
const bestVal = $('bestVal');
const timeFill = $('timeFill');
const overlay = $('overlay');
const bingoBanner = $('bingoBanner');
const bingoText = $('bingoText');

/* ================= AUDIO ================= */
let actx = null;
function initAudio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type = 'sine', vol = 0.08, delay = 0) {
  if (!actx || !state.soundOn) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5];
function playCorrect(streak) {
  const f = SCALE[Math.min(streak - 1, SCALE.length - 1)];
  tone(f, 0.12, 'sine', 0.09);
  tone(f * 1.5, 0.15, 'sine', 0.055, 0.07);
}
function playWrong() {
  tone(220, 0.14, 'triangle', 0.07);
  tone(160, 0.2, 'triangle', 0.07, 0.06);
}
function playBingo() {
  [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, 'sine', 0.1, i * 0.09));
}
function playSuperBingo() {
  [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => tone(f, 0.3, 'sine', 0.11, i * 0.08));
  tone(1046, 0.6, 'triangle', 0.09, 0.5);
}
function playGameOver() {
  tone(392, 0.22, 'triangle', 0.08);
  tone(329.63, 0.22, 'triangle', 0.08, 0.16);
  tone(261.63, 0.45, 'triangle', 0.08, 0.32);
}
function playStart() {
  tone(523, 0.1, 'sine', 0.09);
  tone(659, 0.1, 'sine', 0.09, 0.09);
  tone(784, 0.16, 'sine', 0.09, 0.18);
}

/* ================= HELPERS ================= */
const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const shuffle = a => {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
};

/* ================= GRID GENERATION ================= */
function generateGrid(cfg) {
  const set = new Set();
  const range = cfg.max - cfg.min + 1;
  const needed = 9;
  if (range < needed) throw new Error('Range too small');
  while (set.size < needed) {
    set.add(randInt(cfg.min, cfg.max));
  }
  return [...set];
}

/* ================= QUESTION GENERATION ================= */
function tryGenerateForAnswer(answer, op, cfg) {
  const maxOp = cfg.opMax;

  if (op === '+') {
    // a + b = answer, a,b ∈ [1, maxOp]
    const lo = Math.max(1, answer - maxOp);
    const hi = Math.min(maxOp, answer - 1);
    if (lo > hi) return null;
    const a = randInt(lo, hi);
    return { a, b: answer - a, op: '+', answer };
  }
  if (op === '-') {
    // a - b = answer, b ∈ [1, maxOp], a = answer + b
    const b = randInt(1, maxOp);
    return { a: answer + b, b, op: '-', answer };
  }
  if (op === '×') {
    // a × b = answer, a,b ∈ [1, maxOp]
    const factors = [];
    for (let i = 1; i <= maxOp; i++) {
      if (answer % i === 0 && answer / i <= maxOp) factors.push(i);
    }
    if (!factors.length) return null;
    const a = factors[randInt(0, factors.length - 1)];
    return { a, b: answer / a, op: '×', answer };
  }
  if (op === '÷') {
    // a ÷ b = answer, b ∈ [1, maxOp], a = answer * b
    const b = randInt(1, maxOp);
    const a = answer * b;
    if (a > 999) return null;
    return { a, b, op: '÷', answer };
  }
  return null;
}

function generateQuestionForAnswer(answer, cfg) {
  const ops = shuffle(cfg.ops);
  for (const op of ops) {
    const q = tryGenerateForAnswer(answer, op, cfg);
    if (q) return q;
  }
  return null;
}

function pickQuestion() {
  const cfg = DIFFICULTIES[state.difficulty];
  const availIdx = [];
  state.grid.forEach((v, i) => { if (!state.marked.has(i)) availIdx.push(i); });
  const shuffled = shuffle(availIdx);
  for (const idx of shuffled) {
    const q = generateQuestionForAnswer(state.grid[idx], cfg);
    if (q) return q;
  }
  // Fallback - shouldn't happen
  const idx = shuffled[0];
  return { a: state.grid[idx], b: 0, op: '+', answer: state.grid[idx] };
}

/* ================= RENDER ================= */
function renderQuestion() {
  const q = state.question;
  questionEl.innerHTML =
    `${q.a}<span class="op">${q.op}</span>${q.b}<span class="eq">= ?</span>`;
  questionEl.classList.add('pop');
  setTimeout(() => questionEl.classList.remove('pop'), 340);
}

function renderGrid() {
  gridEl.innerHTML = '';
  state.grid.forEach((num, i) => {
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'cell';
    cell.textContent = num;
    cell.dataset.idx = i;
    if (state.marked.has(i)) cell.classList.add('marked');
    cell.addEventListener('click', () => onCellClick(i, cell));
    gridEl.appendChild(cell);
  });
}

/* ================= HUD ================= */
function updateTimeUI() {
  const t = Math.max(0, Math.ceil(state.timeLeft));
  timeVal.textContent = t;
  const pct = (state.timeLeft / START_TIME) * 100;
  timeFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  timeFill.style.background =
    pct < 25 ? 'var(--bad)' : pct < 50 ? 'var(--gold)' : 'var(--good)';
  timeVal.classList.toggle('low', pct < 25 && state.status === 'playing');
}

function updateHUD() {
  scoreVal.textContent = state.score;
  bingoVal.textContent = state.bingoCount;
  const best = Math.max(state.best[state.difficulty], state.score);
  bestVal.textContent = best;
  if (state.streak >= 2) {
    streakEl.textContent = `🔥 x${state.streak}`;
    streakEl.classList.add('show');
  } else {
    streakEl.classList.remove('show');
  }
  updateTimeUI();
}

/* ================= GAME FLOW ================= */
function startGame() {
  initAudio();
  playStart();
  overlay.classList.remove('show');

  state.status = 'playing';
  state.grid = generateGrid(DIFFICULTIES[state.difficulty]);
  state.marked = new Set();
  state.bingoedLines = new Set();
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.correctCount = 0;
  state.bingoCount = 0;
  state.timeLeft = START_TIME;
  state.locked = false;
  state.lastTs = 0;

  renderGrid();
  state.question = pickQuestion();
  renderQuestion();
  updateHUD();
}

function nextQuestion() {
  state.question = pickQuestion();
  renderQuestion();
  state.locked = false;
}

function onCellClick(idx, cell) {
  if (state.status !== 'playing' || state.locked) return;
  if (state.marked.has(idx)) return;
  if (idx === state.grid.indexOf(state.question.answer)) {
    handleCorrect(idx, cell);
  } else {
    handleWrong(cell);
  }
}

function handleCorrect(idx, cell) {
  state.locked = true;
  state.marked.add(idx);
  cell.classList.add('marked', 'mark-pop');
  setTimeout(() => cell.classList.remove('mark-pop'), 420);

  state.streak++;
  state.bestStreak = Math.max(state.bestStreak, state.streak);
  state.correctCount++;

  const gain = SCORE_BASE + Math.min(state.streak, 10);
  state.score += gain;
  state.timeLeft = Math.min(START_TIME, state.timeLeft + TIME_CORRECT);

  floatAt(cell, '+' + gain, 'gain');
  burstAt(cell, 10);
  playCorrect(state.streak);
  updateHUD();

  // Check bingos on this move
  const newBingos = [];
  LINES.forEach((line, lineIdx) => {
    if (!state.bingoedLines.has(lineIdx) && line.every(i => state.marked.has(i))) {
      newBingos.push(lineIdx);
    }
  });

  if (state.marked.size === 9) {
    // SUPER BINGO — full board
    setTimeout(() => triggerSuperBingo(newBingos), 420);
    return;
  }

  if (newBingos.length > 0) {
    newBingos.forEach(l => state.bingoedLines.add(l));
    state.bingoCount += newBingos.length;
    state.score += SCORE_BINGO * newBingos.length;
    showBingoBanner(newBingos.length > 1 ? 'DOUBLE BINGO!' : 'BINGO!');
    newBingos.forEach(li => {
      LINES[li].forEach(i => {
        const c = gridEl.children[i];
        if (c) c.classList.add('bingo-line');
      });
    });
    playBingo();
    state.timeLeft = Math.min(START_TIME, state.timeLeft + 5);
    updateHUD();
    setTimeout(() => {
      document.querySelectorAll('.bingo-line').forEach(c => c.classList.remove('bingo-line'));
      if (state.status === 'playing') nextQuestion();
    }, 900);
    return;
  }

  setTimeout(() => {
    if (state.status === 'playing') nextQuestion();
  }, 300);
}

function triggerSuperBingo(newBingos) {
  state.score += SCORE_SUPER;
  state.bingoCount += 1;
  newBingos.forEach(l => state.bingoedLines.add(l));
  state.timeLeft = Math.min(START_TIME, state.timeLeft + 15);

  showBingoBanner('SUPER BINGO! 🏆');
  playSuperBingo();
  confettiBurst();
  updateHUD();

  setTimeout(() => {
    if (state.status !== 'playing') return;
    // Reset board with new numbers
    state.grid = generateGrid(DIFFICULTIES[state.difficulty]);
    state.marked = new Set();
    state.bingoedLines = new Set();
    renderGrid();
    nextQuestion();
  }, 1200);
}

function handleWrong(cell) {
  cell.classList.add('wrong');
  setTimeout(() => cell.classList.remove('wrong'), 420);

  state.streak = 0;
  state.timeLeft = Math.max(0, state.timeLeft - TIME_WRONG);
  floatAt(cell, '−' + TIME_WRONG + 's', 'penalty');
  playWrong();
  updateHUD();

  if (state.timeLeft <= 0) endGame();
}

function endGame() {
  if (state.status !== 'playing') return;
  state.status = 'over';

  const prev = state.best[state.difficulty];
  const isNew = state.score > prev;
  if (isNew) {
    state.best[state.difficulty] = state.score;
    try { localStorage.setItem(BEST_KEY, JSON.stringify(state.best)); } catch (e) {}
  }

  updateHUD();
  playGameOver();
  setTimeout(() => showGameOverOverlay(isNew), 700);
}

/* ================= FX ================= */
function floatAt(el, text, cls) {
  const r = el.getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'floater ' + cls;
  d.textContent = text;
  d.style.left = (r.left + r.width / 2) + 'px';
  d.style.top = (r.top + r.height / 2) + 'px';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 950);
}

function burstAt(el, count) {
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const colors = ['#00e5ff', '#7c4dff', '#ffd740', '#00e676', '#ff4081'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const ang = (Math.PI * 2 * i) / count + Math.random() * 0.6;
    const dist = 40 + Math.random() * 55;
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
    p.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(1) + 'px');
    p.style.background = colors[i % colors.length];
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 760);
  }
}

function confettiBurst() {
  const colors = ['#ffd740', '#ff6b00', '#00e676', '#00e5ff', '#7c4dff', '#ff4081'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const startX = window.innerWidth / 2 + (Math.random() - 0.5) * 100;
    const startY = window.innerHeight / 2;
    p.style.left = startX + 'px';
    p.style.top = startY + 'px';
    p.style.width = (6 + Math.random() * 6) + 'px';
    p.style.height = p.style.width;
    const ang = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * 250;
    p.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
    p.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(1) + 'px');
    p.style.background = colors[i % colors.length];
    p.style.animationDuration = (0.9 + Math.random() * 0.5) + 's';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 1500);
  }
}

function showBingoBanner(text) {
  bingoText.textContent = text;
  bingoBanner.classList.add('show');
  setTimeout(() => bingoBanner.classList.remove('show'), 1200);
}

/* ================= OVERLAYS ================= */
function renderDiffPicker() {
  const picker = $('diffPicker');
  picker.innerHTML = '';
  Object.keys(DIFFICULTIES).forEach(key => {
    const d = DIFFICULTIES[key];
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'diff-btn' + (key === state.difficulty ? ' active' : '');
    btn.innerHTML = `<span class="ico">${d.icon}</span><span>${d.name}</span>`;
    btn.onclick = () => {
      state.difficulty = key;
      renderDiffPicker();
      updateHUD();
    };
    picker.appendChild(btn);
  });
}

function showStartOverlay() {
  $('ovIcon').textContent = '🎯';
  $('ovTitle').textContent = 'Math Bingo';
  $('ovSub').textContent = 'सवाल का सही जवाब ग्रिड में ढूँढो। लाइन बनाओ = BINGO, पूरा बोर्ड भरो = SUPER BINGO!';
  $('ovStats').innerHTML = '';
  $('diffPicker').style.display = 'grid';
  renderDiffPicker();

  const btn = $('ovBtn');
  btn.textContent = '▶  खेलना शुरू करें';
  btn.onclick = startGame;
  $('ovBtn2').style.display = 'none';

  overlay.classList.add('show');
}

function showGameOverOverlay(isNew) {
  $('ovIcon').textContent = isNew ? '🏆' : '⏱️';
  $('ovTitle').textContent = isNew ? 'नया रिकॉर्ड!' : 'समय खत्म!';
  $('ovSub').textContent = isNew ? 'शानदार प्रदर्शन! 🎉' : 'अच्छी कोशिश — फिर से खेलो!';

  $('diffPicker').style.display = 'none';

  const stats = $('ovStats');
  stats.innerHTML = '';
  [
    ['स्कोर', state.score],
    ['BINGO', state.bingoCount],
    ['सही जवाब', state.correctCount],
    ['बेस्ट स्ट्रीक', state.bestStreak],
  ].forEach(([k, v]) => {
    const d = document.createElement('div');
    d.className = 'ov-stat';
    d.innerHTML = `<span>${k}</span><strong>${v}</strong>`;
    stats.appendChild(d);
  });

  const btn = $('ovBtn');
  btn.textContent = '🔄  फिर से खेलें';
  btn.onclick = startGame;

  const btn2 = $('ovBtn2');
  btn2.style.display = 'block';
  btn2.textContent = '⚙️  कठिनाई बदलें';
  btn2.onclick = showStartOverlay;

  overlay.classList.add('show');
}

/* ================= SOUND TOGGLE ================= */
$('soundToggle').addEventListener('click', () => {
  state.soundOn = !state.soundOn;
  $('soundToggle').textContent = state.soundOn ? '🔊' : '🔇';
  initAudio();
});

/* ================= MAIN LOOP ================= */
function loop(ts) {
  requestAnimationFrame(loop);
  if (state.status !== 'playing') { state.lastTs = 0; return; }
  if (!state.lastTs) { state.lastTs = ts; return; }

  let dt = (ts - state.lastTs) / 1000;
  state.lastTs = ts;
  if (dt > 0.25) dt = 0.25;

  state.timeLeft -= dt;
  if (state.timeLeft <= 0) {
    state.timeLeft = 0;
    updateTimeUI();
    endGame();
    return;
  }
  updateTimeUI();
}

/* ================= INIT ================= */
(function init() {
  try {
    const saved = JSON.parse(localStorage.getItem(BEST_KEY) || '{}');
    Object.assign(state.best, saved);
  } catch (e) {}
  updateHUD();
  renderGrid();
  showStartOverlay();
  requestAnimationFrame(loop);
})();
</script>
