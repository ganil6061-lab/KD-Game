<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#667eea,#764ba2);font-family:'Segoe UI',system-ui,sans-serif}
.app{width:100%;max-width:420px;height:746px;max-height:100vh;background:linear-gradient(160deg,#f8f9ff,#e8ecff);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}
header{padding:18px;background:linear-gradient(135deg,#5b6ef5,#8b5cf6);color:#fff;text-align:center}
header h1{font-size:22px;margin-bottom:10px}
.stats{display:flex;justify-content:space-around;font-size:14px;font-weight:600}
.stats span{background:rgba(255,255,255,.2);padding:6px 14px;border-radius:20px}
.grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:12px;padding:20px}
.card{perspective:1000px;cursor:pointer}
.card-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flipped .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:42px}
.card-back{background:linear-gradient(135deg,#5b6ef5,#8b5cf6);color:#fff;font-size:36px;font-weight:bold;box-shadow:0 4px 12px rgba(91,110,245,.4)}
.card-front{background:#fff;transform:rotateY(180deg);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.card.matched .card-front{background:#d4f8d4;box-shadow:0 0 20px #4ade80;animation:pop .4s}
@keyframes pop{50%{transform:rotateY(180deg) scale(1.15)}}
.card.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.win{position:absolute;inset:0;background:rgba(0,0,0,.82);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px;z-index:10}
.win.show{display:flex;animation:fade .4s}
@keyframes fade{from{opacity:0}}
.win h2{font-size:36px;margin-bottom:12px}
.win p{font-size:16px;opacity:0.85;margin-bottom:8px;line-height:1.5}
.back-hint{font-size:13px;opacity:0.6;font-style:italic;margin-top:16px}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🧠 Memory Match</h1>
    <div class="stats"><span>Moves: <b id="moves">0</b></span><span>Time: <b id="timer">0s</b></span></div>
  </header>
  <div class="grid" id="grid"></div>
  <div class="win" id="win">
    <h2>🎉 Victory!</h2>
    <p id="winStats"></p>
    <p class="back-hint">Use your device's back button to exit.</p>
  </div>
</div>
<script>
const emojis=['🐶','🐱','🐰','🦊','🐼','🐸'];
let cards=[],flipped=[],matched=0,moves=0,timer=0,interval=null,started=false,gameOver=false;
const grid=document.getElementById('grid'),movesEl=document.getElementById('moves'),timerEl=document.getElementById('timer'),winEl=document.getElementById('win'),winStats=document.getElementById('winStats');

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function init(){
  cards=shuffle([...emojis,...emojis]);matched=0;moves=0;flipped=[];timer=0;started=false;gameOver=false;
  clearInterval(interval);movesEl.textContent=0;timerEl.textContent='0s';winEl.classList.remove('show');
  grid.innerHTML='';
  cards.forEach((e,i)=>{
    const c=document.createElement('div');c.className='card';c.dataset.emoji=e;c.dataset.index=i;
    c.innerHTML=`<div class="card-inner"><div class="card-face card-back">?</div><div class="card-face card-front">${e}</div></div>`;
    c.addEventListener('click',()=>flip(c));grid.appendChild(c);
  });
}

function flip(card){
  if(gameOver)return;
  if(!started){started=true;interval=setInterval(()=>{timer++;timerEl.textContent=timer+'s'},1000)}
  if(card.classList.contains('flipped')||card.classList.contains('matched')||flipped.length===2)return;
  card.classList.add('flipped');flipped.push(card);
  if(flipped.length===2){
    moves++;movesEl.textContent=moves;
    const [a,b]=flipped;
    if(a.dataset.emoji===b.dataset.emoji){
      setTimeout(()=>{a.classList.add('matched');b.classList.add('matched');matched++;flipped=[];
        if(matched===6)win();},500);
    }else{
      setTimeout(()=>{a.classList.add('shake');b.classList.add('shake');},300);
      setTimeout(()=>{a.classList.remove('flipped','shake');b.classList.remove('flipped','shake');flipped=[];},1000);
    }
  }
}

function win(){
  gameOver=true;
  clearInterval(interval);
  winStats.textContent=`Final Score — Moves: ${moves} | Time: ${timer}s`;
  winEl.classList.add('show');
}

init();
</script>
</body>
</html>
