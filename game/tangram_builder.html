<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>Tangram — Portrait</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: 10px 12px;
    gap: 8px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
  }
  .header h1 { margin: 0; font-size: 17px; letter-spacing: 0.3px; }
  .progress {
    background: #1e293b;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 700;
    color: #38bdf8;
  }
  .bar {
    height: 4px;
    background: #1e293b;
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #22c55e, #38bdf8);
    transition: width 0.3s ease;
  }
  .board-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    width: min(100%, 55vh);
    max-width: 360px;
    aspect-ratio: 1;
  }
  .cell {
    aspect-ratio: 1;
    border-radius: 8px;
    background: #1e293b;
    border: 2px dashed #334155;
    cursor: pointer;
    transition: transform 0.08s, background 0.15s, border-color 0.15s;
  }
  .cell.target {
    background: #1e3a5f;
    border-color: #3b82f6;
    border-style: solid;
  }
  .cell.placed {
    border-style: solid;
    border-color: rgba(255,255,255,0.18);
  }
  .cell.valid {
    border-color: #22c55e;
    border-style: solid;
    background: #14532d;
  }
  .cell.invalid {
    border-color: #ef4444;
    border-style: solid;
    background: #450a0a;
  }
  .palette {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 2px 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    min-height: 62px;
  }
  .palette::-webkit-scrollbar { display: none; }
  .piece-btn {
    flex: 0 0 auto;
    background: #1e293b;
    border: 2px solid #334155;
    border-radius: 10px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    min-width: 54px;
    color: #f1f5f9;
    font-size: 10px;
    font-weight: 600;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.08s;
  }
  .piece-btn:active { transform: scale(0.94); }
  .piece-btn.selected {
    border-color: #38bdf8;
    box-shadow: 0 0 0 2px rgba(56,189,248,0.35);
  }
  .piece-btn.used {
    opacity: 0.28;
    filter: grayscale(1);
    pointer-events: none;
  }
  .mini { display: grid; gap: 1px; }
  .mini-cell {
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }
  .actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .actions button {
    padding: 11px 4px;
    background: #1e293b;
    color: #f1f5f9;
    border: 1px solid #334155;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.08s, filter 0.1s;
  }
  .actions button:active { transform: scale(0.95); filter: brightness(1.15); }
  .actions .primary { background: #2563eb; border-color: #3b82f6; }
  .actions .warn { background: #7f1d1d; border-color: #991b1b; }
  .toast {
    position: fixed;
    bottom: 130px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(15,23,42,0.95);
    color: #f1f5f9;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid #334155;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 50;
  }
  .toast.show { opacity: 1; }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    animation: fadeIn 0.2s;
  }
  .overlay.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .win-card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    max-width: 280px;
    width: 100%;
    animation: pop 0.3s cubic-bezier(.2,.9,.3,1.4);
  }
  @keyframes pop { from { transform: scale(0.85); } to { transform: scale(1); } }
  .win-card h2 { margin: 0 0 8px; font-size: 22px; }
  .win-card p { margin: 0 0 16px; color: #94a3b8; font-size: 14px; }
  .win-card button {
    padding: 12px 24px;
    background: #2563eb;
    color: #fff;
    border: 0;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1 id="puzzleName">Square</h1>
    <span class="progress" id="progress">0/16</span>
  </div>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>
  <div class="palette" id="palette"></div>
  <div class="actions">
    <button id="rotateBtn">🔄 Rotate</button>
    <button id="undoBtn">↩ Undo</button>
    <button id="resetBtn" class="warn">🔁 Reset</button>
    <button id="nextBtn" class="primary">➡ Next</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="overlay hidden" id="winOverlay">
  <div class="win-card">
    <h2>Perfect! 🎉</h2>
    <p>Shape complete ho gaya.</p>
    <button id="nextFromWin">Next Puzzle</button>
  </div>
</div>
<script>
  const N = 4;

  const pieceDefs = {
    big1:  { name:"Big",   color:"#ef4444", cells:[[0,0],[1,0],[0,1],[1,1]] },
    big2:  { name:"Big",   color:"#f97316", cells:[[0,0],[1,0],[0,1],[1,1]] },
    med1:  { name:"Med",   color:"#eab308", cells:[[0,0],[1,0]] },
    med2:  { name:"Med",   color:"#22c55e", cells:[[0,0],[1,0]] },
    para:  { name:"Para",  color:"#06b6d4", cells:[[0,0],[1,0]] },
    small1:{ name:"Small", color:"#8b5cf6", cells:[[0,0]] },
    small2:{ name:"Small", color:"#ec4899", cells:[[0,0]] }
  };

  const puzzles = [
    {
      name: "Square",
      target: ["1111","1111","1111","1111"],
      pieces: ["big1","big2","med1","med2","para","small1","small2"]
    },
    {
      name: "Rectangle",
      target: ["1111","1111","1111","0000"],
      pieces: ["big1","med1","med2","para","small1","small2"]
    },
    {
      name: "Cross",
      target: ["0110","1111","1111","0110"],
      pieces: ["big1","med1","med2","para","small1","small2"]
    }
  ];

  let puzzleIdx = 0;
  let target = [];
  let occupied = [];
  let placed = [];
  let used = new Set();
  let selectedId = null;
  let selectedCells = null;
  let currentPieces = [];

  const boardEl     = document.getElementById("board");
  const paletteEl   = document.getElementById("palette");
  const progressEl  = document.getElementById("progress");
  const barFill     = document.getElementById("barFill");
  const puzzleNameEl= document.getElementById("puzzleName");
  const winOverlay  = document.getElementById("winOverlay");
  const toastEl     = document.getElementById("toast");

  function flatten(rows) {
    return rows.flatMap(r => [...r].map(c => c === "1"));
  }

  function normalize(cells) {
    const minX = Math.min(...cells.map(c => c[0]));
    const minY = Math.min(...cells.map(c => c[1]));
    return cells.map(([x,y]) => [x-minX, y-minY]);
  }

  function rotateCells(cells) {
    return normalize(cells.map(([x,y]) => [y, -x]));
  }

  function loadPuzzle(idx) {
    puzzleIdx = ((idx % puzzles.length) + puzzles.length) % puzzles.length;
    const p = puzzles[puzzleIdx];
    target = flatten(p.target);
    currentPieces = p.pieces.slice();
    puzzleNameEl.textContent = p.name;
    reset();
  }

  function reset() {
    occupied = Array(N*N).fill(null);
    placed = [];
    used = new Set();
    selectedId = null;
    selectedCells = null;
    winOverlay.classList.add("hidden");
    render();
  }

  function render() {
    renderBoard();
    renderPalette();
    updateProgress();
  }

  function renderBoard() {
    boardEl.innerHTML = "";
    for (let y = 0; y < N; y++) {
      for (let x = 0; x < N; x++) {
        const i = y*N + x;
        const cell = document.createElement("div");
        cell.className = "cell";
        if (target[i]) cell.classList.add("target");
        const pid = occupied[i];
        if (pid) {
          cell.classList.add("placed");
          cell.style.background = pieceDefs[pid].color;
        }
        cell.addEventListener("click", () => handleClick(x, y));
        cell.addEventListener("mouseenter", () => showPreview(x, y));
        boardEl.appendChild(cell);
      }
    }
  }

  function renderPalette() {
    paletteEl.innerHTML = "";
    currentPieces.forEach(id => {
      const p = pieceDefs[id];
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "piece-btn";
      if (used.has(id)) btn.classList.add("used");
      if (selectedId === id) btn.classList.add("selected");

      const maxX = Math.max(...p.cells.map(c => c[0]));
      const maxY = Math.max(...p.cells.map(c => c[1]));
      const mini = document.createElement("div");
      mini.className = "mini";
      mini.style.gridTemplateColumns = `repeat(${maxX+1}, 10px)`;
      for (let y = 0; y <= maxY; y++) {
        for (let x = 0; x <= maxX; x++) {
          const mc = document.createElement("div");
          mc.className = "mini-cell";
          if (p.cells.some(([cx,cy]) => cx === x && cy === y)) {
            mc.style.background = p.color;
          }
          mini.appendChild(mc);
        }
      }
      const label = document.createElement("span");
      label.textContent = p.name;
      btn.appendChild(mini);
      btn.appendChild(label);
      btn.addEventListener("click", () => selectPiece(id));
      paletteEl.appendChild(btn);
    });
  }

  function selectPiece(id) {
    if (used.has(id)) return;
    if (selectedId === id) {
      selectedId = null;
      selectedCells = null;
    } else {
      selectedId = id;
      selectedCells = pieceDefs[id].cells.map(c => [...c]);
    }
    renderPalette();
    clearPreview();
    if (selectedId) toast("Ab board par tap karo");
  }

  function rotateSelected() {
    if (!selectedId) { toast("Pehle piece select karo"); return; }
    selectedCells = rotateCells(selectedCells);
    renderPalette();
    clearPreview();
    toast("Rotated");
  }

  function showPreview(x, y) {
    clearPreview();
    if (!selectedId) return;
    const cells = selectedCells.map(([dx,dy]) => [x+dx, y+dy]);
    const valid = cells.every(([cx,cy]) =>
      cx>=0 && cx<N && cy>=0 && cy<N &&
      target[cy*N+cx] && !occupied[cy*N+cx]
    );
    cells.forEach(([cx,cy]) => {
      if (cx<0 || cx>=N || cy<0 || cy>=N) return;
      const el = boardEl.children[cy*N+cx];
      el.classList.add(valid ? "valid" : "invalid");
    });
  }

  function clearPreview() {
    boardEl.querySelectorAll(".valid,.invalid")
      .forEach(el => el.classList.remove("valid","invalid"));
  }

  function handleClick(x, y) {
    const i = y*N + x;
    const pid = occupied[i];
    if (pid) { removePiece(pid); return; }
    if (!selectedId) { toast("Pehle piece select karo"); return; }
    tryPlace(x, y);
  }

  function tryPlace(x, y) {
    const cells = selectedCells.map(([dx,dy]) => [x+dx, y+dy]);
    const valid = cells.every(([cx,cy]) =>
      cx>=0 && cx<N && cy>=0 && cy<N &&
      target[cy*N+cx] && !occupied[cy*N+cx]
    );
    if (!valid) { toast("Yahan fit nahi hoga"); return; }

    cells.forEach(([cx,cy]) => { occupied[cy*N+cx] = selectedId; });
    placed.push({ id: selectedId, cells });
    used.add(selectedId);
    selectedId = null;
    selectedCells = null;
    render();
    checkWin();
  }

  function removePiece(pid) {
    const idx = placed.findIndex(p => p.id === pid);
    if (idx === -1) return;
    placed[idx].cells.forEach(([cx,cy]) => { occupied[cy*N+cx] = null; });
    placed.splice(idx, 1);
    used.delete(pid);
    render();
    toast("Removed");
  }

  function undo() {
    if (!placed.length) { toast("Kuch nahi hai"); return; }
    removePiece(placed[placed.length-1].id);
  }

  function updateProgress() {
    const total = target.filter(Boolean).length;
    const filled = target.reduce((a, t, i) => a + (t && occupied[i] ? 1 : 0), 0);
    progressEl.textContent = `${filled}/${total}`;
    barFill.style.width = total ? `${(filled/total)*100}%` : "0%";
  }

  function checkWin() {
    const total = target.filter(Boolean).length;
    const filled = target.reduce((a, t, i) => a + (t && occupied[i] ? 1 : 0), 0);
    if (total > 0 && filled === total) {
      winOverlay.classList.remove("hidden");
    }
  }

  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1400);
  }

  document.getElementById("rotateBtn").onclick = rotateSelected;
  document.getElementById("undoBtn").onclick = undo;
  document.getElementById("resetBtn").onclick = reset;
  document.getElementById("nextBtn").onclick = () => loadPuzzle(puzzleIdx+1);
  document.getElementById("nextFromWin").onclick = () => loadPuzzle(puzzleIdx+1);
  boardEl.addEventListener("mouseleave", clearPreview);

  loadPuzzle(0);
</script>
</body>
</html>
